name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: staff-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to apk branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/GrillHubStaff.apk
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan apk
          git rm -rf . --quiet
          cp /tmp/GrillHubStaff.apk .
          git add GrillHubStaff.apk
          git commit -m "Staff debug APK"
          git push -f origin apk
